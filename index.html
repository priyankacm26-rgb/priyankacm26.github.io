<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanka | Data Analyst Portfolio</title>

<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
scroll-behavior:smooth;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
padding:20px;
background:#1e293b;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-weight:600;
font-size:22px;
}

.nav-links{
display:flex;
gap:20px;
}

.nav-links a{
color:white;
text-decoration:none;
}

.menu-toggle{
display:none;
font-size:22px;
cursor:pointer;
}

/* HERO */
.hero{
text-align:center;
padding:80px 20px;
}

.gradient{
color:#38bdf8;
}

.btn{
background:#38bdf8;
padding:10px 20px;
border-radius:20px;
color:black;
text-decoration:none;
display:inline-block;
margin-top:15px;
}

/* PROJECTS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
}

.project-img{
width:100%;
border-radius:10px;
}

/* SKILLS */
.skill{
margin:10px 0;
}

.bar{
height:6px;
background:#334155;
border-radius:10px;
}

.bar div{
height:100%;
background:#38bdf8;
width:0;
transition:2s;
}

/* RESPONSIVE */
@media(max-width:768px){
.nav-links{
display:none;
flex-direction:column;
background:#1e293b;
position:absolute;
top:60px;
right:0;
padding:20px;
}

.menu-toggle{
display:block;
}
}

</style>
</head>

<body>

<nav>
<div class="logo">Priyanka</div>

<div class="menu-toggle" onclick="toggleMenu()">
<i class="fa-solid fa-bars"></i>
</div>

<div class="nav-links" id="navLinks">
<a href="#about">About</a>
<a href="#skills">Skills</a>
<a href="#projects">Projects</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1>Hello I'm <span class="gradient">Priyanka</span></h1>
<h2 id="typing"></h2>
<a href="priyanka.pdf" class="btn">Download Resume</a>
</section>

<!-- ABOUT -->
<section id="about" class="hero">
<p>Data Analyst skilled in Power BI, Python, SQL and dashboard building.</p>
</section>

<!-- SKILLS -->
<section id="skills" class="hero">

<div class="skill">SQL
<div class="bar"><div data-width="90%"></div></div></div>

<div class="skill">Python
<div class="bar"><div data-width="85%"></div></div></div>

<div class="skill">Power BI
<div class="bar"><div data-width="88%"></div></div></div>

</section>

<!-- PROJECTS -->
<section id="projects">
<div class="grid">

<div class="card">
<h3>Booking Intelligence Dashboard</h3>
<p>Power BI dashboard analyzing hotel bookings, cancellations and pricing trends.</p>
<img src="hotel_dashboard.jpg" class="project-img">
<a href="https://github.com/priyankacm26-rgb/Booking-Intelligence-Dashboard-Power-BI-Project.git" class="btn">View</a>
</div>

</div>
</section>

<script>

/* MENU */
function toggleMenu(){
let nav=document.getElementById("navLinks");
nav.style.display = nav.style.display === "flex" ? "none" : "flex";
}

/* TYPING EFFECT */
let text="Data Analyst | Power BI | Python | SQL";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,50);
}
}
type();

/* SKILL ANIMATION */
window.onload=()=>{
document.querySelectorAll('.bar div').forEach(el=>{
el.style.width=el.getAttribute('data-width');
});
}

</script>

</body>
</html>
